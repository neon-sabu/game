<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>パーティーゲーム</title>
<style>
:root{--g1:#ffd6e8;--g2:#fff1b8;--g3:#c9ecff;--card:rgba(255,255,255,.9);--tx:#2b2140;--sub:#6b6280;--ac:#e8590c;--ac2:#fff;--bd:rgba(60,40,100,.15);--ok:#2b8a3e;--ng:#c92a2a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--g1:#2a1b4d;--g2:#1b2a5a;--g3:#3b1f4f;--card:rgba(30,26,52,.9);--tx:#f1ecff;--sub:#b3aacc;--ac:#ff8a4c;--ac2:#1a1a1a;--bd:rgba(255,255,255,.18);--ok:#69db7c;--ng:#ff8787}}
:root[data-theme="dark"]{--g1:#2a1b4d;--g2:#1b2a5a;--g3:#3b1f4f;--card:rgba(30,26,52,.9);--tx:#f1ecff;--sub:#b3aacc;--ac:#ff8a4c;--ac2:#1a1a1a;--bd:rgba(255,255,255,.18);--ok:#69db7c;--ng:#ff8787}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--tx);font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;line-height:1.6;background:linear-gradient(135deg,var(--g1),var(--g2),var(--g3),var(--g1));background-size:300% 300%;animation:gs 20s ease infinite;transition:background .6s}
body.night{--g1:#080c2a;--g2:#26145a;--g3:#4a1d5e;--card:rgba(24,20,52,.92);--tx:#f1ecff;--sub:#b3aacc;--ac:#ff8a4c;--ac2:#1a1a1a;--bd:rgba(255,255,255,.18)}
@keyframes gs{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
#bg{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
#bg span{position:absolute;bottom:-60px;opacity:0;animation:rise linear infinite}
@keyframes rise{0%{transform:translateY(0) rotate(0);opacity:0}10%{opacity:.55}90%{opacity:.55}100%{transform:translateY(-115vh) rotate(360deg);opacity:0}}
@media (prefers-reduced-motion:reduce){#bg span{animation:none}body{animation:none}}
main{position:relative;z-index:1;max-width:480px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:28px;margin:8px 0 4px;text-align:center}
h2{font-size:21px;margin:0 0 10px;text-align:center}
.sub{color:var(--sub);text-align:center;font-size:14px;margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 6px 18px rgba(80,40,120,.12)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:8px 0}
label{font-weight:700}
.step{display:flex;align-items:center;gap:12px}
.step b{min-width:28px;text-align:center;font-size:20px}
button{font:inherit;cursor:pointer;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:10px 14px;transition:transform .1s}
button:active{transform:scale(.97)}
button.main{background:var(--ac);color:var(--ac2);border-color:var(--ac);font-weight:800;width:100%;padding:14px;font-size:17px;margin-top:6px}
button.round{width:38px;height:38px;padding:0;font-size:20px;border-radius:99px}
button.alt{width:100%;margin-top:8px}
button.back{padding:6px 12px;font-size:14px;margin-bottom:4px}
.gcard{display:block;width:100%;text-align:left;padding:18px;margin-bottom:14px;border-radius:20px;box-shadow:0 6px 18px rgba(80,40,120,.15)}
.gcard .em{font-size:40px;float:left;margin-right:14px;line-height:1.2}
.gcard b{display:block;font-size:20px}
.gcard small{color:var(--sub);font-size:13px}
input[type=text]{width:100%;font:inherit;padding:9px 11px;border-radius:10px;border:1px solid var(--bd);background:transparent;color:var(--tx);margin:4px 0}
.big{font-size:32px;font-weight:800;text-align:center;margin:16px 0}
.word{font-size:38px;font-weight:800;text-align:center;margin:22px 0;color:var(--ac)}
.timer{font-size:64px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;margin:10px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid button{padding:14px 8px;font-weight:700}
.win{font-size:22px;font-weight:800;text-align:center;margin:6px 0 12px}
.tag{display:inline-block;padding:2px 10px;border-radius:99px;font-size:13px;font-weight:700;color:var(--ac2)}
.w{background:var(--ng)}.c{background:var(--ok)}
ul{list-style:none;padding:0;margin:0}
li{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--bd)}
li:last-child{border:0}
li.dead{opacity:.5;text-decoration:line-through}
.note{font-size:14px;color:var(--sub);text-align:center}
</style>
</head>
<body>
<div id="bg"></div>
<main id="app"></main>
<script>
var PAIRS=[["りんご","なし"],["コーヒー","紅茶"],["犬","オオカミ"],["海","プール"],["カレー","シチュー"],["ラーメン","うどん"],["バス","電車"],["スキー","スノーボード"],["映画館","劇場"],["ボールペン","万年筆"],["寿司","刺身"],["ピアノ","オルガン"],["猫","ライオン"],["サッカー","フットサル"],["メロン","スイカ"],["冷蔵庫","冷凍庫"],["傘","レインコート"],["マフラー","ネックウォーマー"],["図書館","本屋"],["コンビニ","スーパー"],["ハンバーガー","サンドイッチ"],["桜","梅"],["夏休み","冬休み"],["ホテル","旅館"],["みかん","オレンジ"],["日の出","夕焼け"],["カラオケ","ライブ"],["自転車","バイク"],["牛乳","豆乳"],["お風呂","温泉"],["やきそば","お好み焼き"],["消しゴム","修正テープ"],["テント","ハンモック"],["時計","タイマー"],["チョコレート","キャラメル"]];
var R={w:["🐺","人狼"],s:["🔮","占い師"],k:["🛡️","騎士"],v:["🏠","村人"]};
var HINT={w:"夜に村人を1人襲撃します。正体がバレないように!",s:"夜に1人を占って、人狼かどうかを知れます。",k:"夜に1人を人狼の襲撃から守れます。",v:"特別な力はありません。推理と議論で人狼を見つけよう。"};
var S={game:"",n:5,wolves:1,min:3,names:[],i:0,shown:false,tid:null,running:false,left:0};
var ww={},wf={};
var app=document.getElementById("app");
(function(){var e=["🐺","🌙","⭐","🎈","🎉","🔮","🍎","🎲","✨","🦊","🎵","🍀"],b=document.getElementById("bg"),h="";
for(var i=0;i<14;i++)h+='<span style="left:'+(Math.random()*95)+'%;font-size:'+(22+Math.random()*22)+'px;animation-duration:'+(14+Math.random()*16)+'s;animation-delay:-'+(Math.random()*25)+'s">'+e[i%e.length]+'</span>';
b.innerHTML=h})();
function esc(s){var d=document.createElement("div");d.textContent=s;return d.innerHTML}
function nm(i){return S.names[i]&&S.names[i].trim()?S.names[i].trim():"プレイヤー"+(i+1)}
function maxWolves(){return S.n>=7?2:1}
function cfg(n){var w=n>=10?3:n>=7?2:1,k=n>=6?1:0;return{w:w,s:1,k:k,v:n-w-1-k}}
function st(l,v,k){return '<div class="row"><label>'+l+'</label><div class="step"><button class="round" data-a="'+k+'-">−</button><b>'+v+'</b><button class="round" data-a="'+k+'+">+</button></div></div>'}
function stop(){clearInterval(S.tid);S.running=false;document.body.classList.remove("night")}
function hub(){
  S.game="";stop();
  app.innerHTML='<h1>🎉 パーティーゲーム</h1><p class="sub">1台のスマホを回して遊ぶ、みんなで盛り上がるゲーム</p>'+
  '<button class="gcard" data-a="g-ww"><span class="em">🗣️</span><b>ワードウルフ</b><small>ひとりだけ違うお題を持つウルフを探せ!(3〜10人)</small></button>'+
  '<button class="gcard" data-a="g-wf"><span class="em">🐺</span><b>人狼</b><small>夜は襲撃、昼は議論と投票。村人 vs 人狼(4〜10人)</small></button>';
}
function setup(g){
  if(g)S.game=g;stop();var isw=S.game==="ww";
  if(S.n<(isw?3:4))S.n=isw?3:4;
  if(S.wolves>maxWolves())S.wolves=maxWolves();
  var h='<button class="back" data-a="hub">← メニュー</button><h1>'+(isw?'🗣️ ワードウルフ':'🐺 人狼')+'</h1>';
  if(isw)h+='<p class="sub">全員にお題が配られますが、ウルフだけ少し違うお題。会話で探り合い、投票でウルフを当てよう。</p>';
  else{var c=cfg(S.n);h+='<p class="sub">夜は人狼が襲撃、占い師が占い、騎士が護衛。昼は議論して1人を処刑。人狼を全滅させれば村人の勝ち、人狼が村人と同数になれば人狼の勝ち。</p>'}
  h+='<div class="card">'+st("人数",S.n,"n");
  if(isw)h+=st("ウルフの数",S.wolves,"w");
  h+=st("議論時間(分)",S.min,"m");
  if(!isw)h+='<p class="note">役職:人狼'+c.w+'・占い師1'+(c.k?'・騎士1':'')+'・村人'+c.v+'</p>';
  h+='</div><div class="card"><label>名前(空欄でもOK)</label>';
  for(var i=0;i<S.n;i++)h+='<input type="text" data-i="'+i+'" maxlength="10" placeholder="プレイヤー'+(i+1)+'" value="'+esc(S.names[i]||"")+'">';
  h+='</div><button class="main" data-a="start">ゲーム開始</button>';
  app.innerHTML=h;
}
function shuffle(a){for(var j=a.length-1;j>0;j--){var k=Math.floor(Math.random()*(j+1)),t=a[j];a[j]=a[k];a[k]=t}return a}
function ask(i,btn,txt){return '<div class="big">'+esc(nm(i))+'さん</div><p class="note">'+txt+'</p><button class="main" data-a="show">'+btn+'</button>'}
function fmt(s){var m=Math.floor(s/60),r=s%60;return m+":"+(r<10?"0":"")+r}
function discuss(next,ttl,sub){
  S.left=S.min*60;S.running=false;
  app.innerHTML='<h2>'+ttl+'</h2><p class="sub">'+sub+'</p><div class="card"><div class="timer" id="t">'+fmt(S.left)+'</div><button class="main" data-a="tg" id="tg">タイマー開始</button></div><button class="alt" data-a="'+next+'">投票へ進む</button>';
}
function tick(){
  S.left--;var t=document.getElementById("t");if(t)t.textContent=fmt(Math.max(S.left,0));
  if(S.left<=0){clearInterval(S.tid);S.running=false;if(t)t.textContent="時間切れ!";var b=document.getElementById("tg");if(b)b.textContent="終了";try{navigator.vibrate&&navigator.vibrate([300,100,300])}catch(e){}}
}
function toggle(){
  var b=document.getElementById("tg");if(S.left<=0)return;
  if(S.running){clearInterval(S.tid);S.running=false;b.textContent="再開"}
  else{S.running=true;S.tid=setInterval(tick,1000);b.textContent="一時停止"}
}
/* ---------- ワードウルフ ---------- */
function wwStart(){
  var p=PAIRS[Math.floor(Math.random()*PAIRS.length)];
  ww.pair=Math.random()<.5?[p[0],p[1]]:[p[1],p[0]];
  var idx=[];for(var i=0;i<S.n;i++)idx.push(i);
  ww.wolfIdx=shuffle(idx).slice(0,S.wolves);S.i=0;S.shown=false;wwReveal();
}
function isWolf(i){return ww.wolfIdx.indexOf(i)>=0}
function wwReveal(){
  var h='<h2>お題の確認</h2><p class="sub">'+(S.i+1)+' / '+S.n+'</p><div class="card">';
  if(!S.shown)h+=ask(S.i,"お題を見る","他の人に見えないようにして、ボタンを押してください");
  else h+='<p class="note">'+esc(nm(S.i))+'さんのお題</p><div class="word">'+esc(isWolf(S.i)?ww.pair[1]:ww.pair[0])+'</div><p class="note">覚えたら隠して、次の人に渡してください</p><button class="main" data-a="hide">'+(S.i+1<S.n?"隠して次の人へ":"隠して議論をはじめる")+'</button>';
  app.innerHTML=h+'</div>';
}
function wwVote(){
  stop();var h='<h2>投票</h2><p class="sub">せーので全員が同時に指さし、いちばん票を集めた人を選んでください(同票なら決選投票)</p><div class="grid">';
  for(var i=0;i<S.n;i++)h+='<button data-a="ww-pick" data-i="'+i+'">'+esc(nm(i))+'</button>';
  app.innerHTML=h+'</div>';
}
function wwList(){
  var h='<ul>';
  for(var i=0;i<S.n;i++){var w=isWolf(i);h+='<li><span>'+esc(nm(i))+'</span><span><span class="tag '+(w?"w":"c")+'">'+(w?"ウルフ":"市民")+'</span> '+esc(w?ww.pair[1]:ww.pair[0])+'</span></li>'}
  return h+'</ul><button class="main" data-a="again">同じメンバーでもう一度</button><button class="alt" data-a="setup">設定に戻る</button>';
}
function wwResult(v){
  var h='<h2>結果発表</h2><div class="card"><p class="note">最多票は…</p><div class="big">'+esc(nm(v))+'さん</div>';
  if(isWolf(v))h+='<div class="win" style="color:var(--ok)">ウルフを見つけた!</div><p class="note">ただしウルフは最後のチャンス。市民のお題を当てれば逆転勝ちです。</p><div class="grid"><button data-a="guess" data-g="1">当てた(ウルフの勝ち)</button><button data-a="guess" data-g="0">外した(市民の勝ち)</button></div>';
  else h+='<div class="win" style="color:var(--ng)">ウルフではありませんでした…ウルフの勝ち!</div>'+wwList();
  app.innerHTML=h+'</div>';
}
function wwGuess(g){
  app.innerHTML='<h2>結果発表</h2><div class="card"><div class="win" style="color:'+(g?"var(--ng)":"var(--ok)")+'">'+(g?"🐺 ウルフの逆転勝ち!":"🎉 市民の勝ち!")+'</div>'+wwList()+'</div>';
}
/* ---------- 人狼 ---------- */
function wfStart(){
  var c=cfg(S.n),r=[],i;
  for(i=0;i<c.w;i++)r.push("w");r.push("s");if(c.k)r.push("k");
  while(r.length<S.n)r.push("v");
  wf={roles:shuffle(r),alive:[],N:null};
  for(i=0;i<S.n;i++)wf.alive.push(true);
  S.i=0;S.shown=false;wfReveal();
}
function wfReveal(){
  var i=S.i,r=wf.roles[i],h='<h2>役職の確認</h2><p class="sub">'+(i+1)+' / '+S.n+'</p><div class="card">';
  if(!S.shown)h+=ask(i,"役職を見る","他の人に見えないようにして、ボタンを押してください");
  else{
    h+='<p class="note">'+esc(nm(i))+'さんの役職</p><div class="word">'+R[r][0]+' '+R[r][1]+'</div>';
    if(r==="w"){var o=[];wf.roles.forEach(function(x,j){if(x==="w"&&j!==i)o.push(nm(j))});h+='<p class="note"><b>'+(o.length?'仲間:'+esc(o.join("、")):'仲間はいません')+'</b></p>'}
    h+='<p class="note">'+HINT[r]+'</p><button class="main" data-a="hide">'+(i+1<S.n?"隠して次の人へ":"隠して夜をはじめる")+'</button>';
  }
  app.innerHTML=h+'</div>';
}
function aliveIdx(f){var a=[];for(var i=0;i<S.n;i++)if(wf.alive[i]&&(!f||f(i)))a.push(i);return a}
function pickList(a){var h='<div class="grid">';a.forEach(function(i){h+='<button data-a="npick" data-i="'+i+'">'+esc(nm(i))+'</button>'});return h+'</div>'}
function wfNight(){
  document.body.classList.add("night");
  wf.N={order:aliveIdx(),pos:0,victim:-1,guard:-1,phase:"pass",msg:""};wfTurn();
}
function wfTurn(){
  var N=wf.N;if(N.pos>=N.order.length)return wfMorning();
  var p=N.order[N.pos],r=wf.roles[p],h,nb='<button class="main" data-a="nnext">隠して次へ</button>';
  if(N.phase==="pass")h='<h2>🌙 夜</h2><p class="sub">みんな目を閉じて。呼ばれた人だけスマホを受け取ってください</p><div class="card"><div class="big">'+esc(nm(p))+'さん</div><button class="main" data-a="nact">私は'+esc(nm(p))+'です(見る)</button></div>';
  else if(N.phase==="act"){
    h='<h2>'+R[r][0]+' '+R[r][1]+'</h2><div class="card">';
    if(r==="v")h+='<p class="note">夜はやることがありません。</p>'+nb;
    else if(r==="w"){
      var first=N.order.filter(function(j){return wf.roles[j]==="w"})[0];
      if(p===first)h+='<p class="note">襲撃する人を選んでください(仲間がいれば相談してOK)</p>'+pickList(aliveIdx(function(i){return wf.roles[i]!=="w"}));
      else h+='<p class="note">襲撃先は最初の人狼('+esc(nm(first))+'さん)が決めます。</p>'+nb;
    }
    else if(r==="s")h+='<p class="note">占う人を選んでください</p>'+pickList(aliveIdx(function(i){return i!==p}));
    else h+='<p class="note">守る人を選んでください(自分もOK)</p>'+pickList(aliveIdx());
    h+='</div>';
  }else h='<h2>'+R[r][0]+' '+R[r][1]+'</h2><div class="card"><div class="win">'+N.msg+'</div>'+nb+'</div>';
  app.innerHTML=h;
}
function wfPick(i){
  var N=wf.N,p=N.order[N.pos],r=wf.roles[p];
  if(r==="w"){N.victim=i;N.msg=esc(nm(i))+'さんを襲撃します'}
  else if(r==="s")N.msg=esc(nm(i))+'さんは「'+(wf.roles[i]==="w"?'人狼です':'人狼ではありません')+'」';
  else{N.guard=i;N.msg=esc(nm(i))+'さんを護衛します'}
  N.phase="done";wfTurn();
}
function winner(){
  var w=aliveIdx(function(i){return wf.roles[i]==="w"}).length,o=aliveIdx(function(i){return wf.roles[i]!=="w"}).length;
  return w===0?"v":(w>=o?"w":"");
}
function wfMorning(){
  document.body.classList.remove("night");
  var N=wf.N,dead=-1;
  if(N.victim>=0&&N.victim!==N.guard){dead=N.victim;wf.alive[dead]=false}
  var msg=dead>=0?esc(nm(dead))+'さんが無残な姿で発見されました…':'昨夜は誰も死にませんでした。平和な朝です!';
  var w=winner();if(w)return wfEnd(w,msg);
  app.innerHTML='<h2>☀️ 朝になりました</h2><div class="card"><div class="win">'+msg+'</div>'+wfAlive()+'</div><button class="main" data-a="wf-day">議論をはじめる</button>';
}
function wfAlive(){return '<p class="note">生存者('+aliveIdx().length+'人):'+aliveIdx().map(function(i){return esc(nm(i))}).join("、")+'</p>'}
function wfVote(){
  stop();app.innerHTML='<h2>処刑の投票</h2><p class="sub">せーので全員が同時に指さし、最多票の人を選んでください(同票なら決選投票)</p>'+pickList(aliveIdx()).replace(/npick/g,"wf-pick");
}
function wfExec(i){
  wf.alive[i]=false;var msg=esc(nm(i))+'さんが処刑されました',w=winner();
  if(w)return wfEnd(w,msg);
  app.innerHTML='<h2>⚖️ 処刑</h2><div class="card"><div class="win">'+msg+'</div>'+wfAlive()+'<p class="note">役職は秘密のまま。夜がやってきます…</p></div><button class="main" data-a="wf-night">夜になる 🌙</button>';
}
function wfEnd(w,msg){
  var h='<h2>ゲーム終了</h2><div class="card"><p class="note">'+msg+'</p><div class="win" style="color:'+(w==="v"?"var(--ok)":"var(--ng)")+'">'+(w==="v"?"🎉 村人の勝ち!":"🐺 人狼の勝ち!")+'</div><ul>';
  for(var i=0;i<S.n;i++){var r=wf.roles[i];h+='<li class="'+(wf.alive[i]?"":"dead")+'"><span>'+esc(nm(i))+'</span><span><span class="tag '+(r==="w"?"w":"c")+'">'+R[r][0]+' '+R[r][1]+'</span></span></li>'}
  app.innerHTML=h+'</ul><button class="main" data-a="again">同じメンバーでもう一度</button><button class="alt" data-a="setup">設定に戻る</button><button class="alt" data-a="hub">メニューへ</button></div>';
}
/* ---------- 操作 ---------- */
app.addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b)return;var a=b.getAttribute("data-a"),m,isw=S.game==="ww",iv=parseInt(b.getAttribute("data-i"),10);
  if(a==="hub")hub();
  else if(a==="g-ww"||a==="g-wf")setup(a.slice(2));
  else if((m=/^([nwm])([+-])$/.exec(a))){
    var d=m[2]==="+"?1:-1;
    if(m[1]==="n"&&S.n+d>=(isw?3:4)&&S.n+d<=10)S.n+=d;
    else if(m[1]==="w"&&S.wolves+d>=1&&S.wolves+d<=maxWolves())S.wolves+=d;
    else if(m[1]==="m"&&S.min+d>=1&&S.min+d<=10)S.min+=d;
    setup();
  }
  else if(a==="start"||a==="again")isw?wwStart():wfStart();
  else if(a==="setup")setup();
  else if(a==="show"){S.shown=true;isw?wwReveal():wfReveal()}
  else if(a==="hide"){S.shown=false;S.i++;
    if(S.i<S.n)isw?wwReveal():wfReveal();
    else if(isw)discuss("ww-vote","議論タイム","お題について話しながら、ウルフを探そう。自分のお題は言わないこと!");
    else wfNight()}
  else if(a==="tg")toggle();
  else if(a==="ww-vote")wwVote();
  else if(a==="ww-pick")wwResult(iv);
  else if(a==="guess")wwGuess(b.getAttribute("data-g")==="1");
  else if(a==="nact"){wf.N.phase="act";wfTurn()}
  else if(a==="npick")wfPick(iv);
  else if(a==="nnext"){wf.N.pos++;wf.N.phase="pass";wf.N.msg="";wfTurn()}
  else if(a==="wf-day")discuss("wf-vote","☀️ 議論タイム","昨夜の出来事をもとに、人狼を推理しよう。");
  else if(a==="wf-vote")wfVote();
  else if(a==="wf-pick")wfExec(iv);
  else if(a==="wf-night")wfNight();
});
app.addEventListener("input",function(e){
  var i=e.target.getAttribute&&e.target.getAttribute("data-i");
  if(i!==null&&e.target.tagName==="INPUT")S.names[parseInt(i,10)]=e.target.value;
});
hub();
</script>
</body>
</html>
